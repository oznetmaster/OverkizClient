name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version or tag to publish, for example 1.2.3 or v1.2.3
        required: true
        type: string

permissions:
  checks: read
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PROJECT_PATH: OverKizApi/OverKizApi.csproj
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify configured release checks
        shell: pwsh
        working-directory: ${{ github.workspace }}/.
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
        run: '& ./.github/scripts/Wait-RequiredReleaseChecks.ps1'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Determine package version
        id: version
        shell: pwsh
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_INPUT: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $rawVersion = switch ($env:RELEASE_EVENT) {
              'workflow_dispatch' { $env:RELEASE_INPUT; break }
              'push' { $env:RELEASE_REF; break }
              default { '' }
          }
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
              throw 'No release tag or manual version was provided.'
          }

          $packageVersion = $rawVersion.Trim()
          if ($packageVersion.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
              $packageVersion = $packageVersion.Substring(1)
          }

          if ($packageVersion -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z\.-]+)?$') {
              throw "Version '$packageVersion' is not a supported NuGet semantic version."
          }

          [xml]$project = Get-Content -LiteralPath $env:PROJECT_PATH -Raw
          foreach ($propertyName in @('Version', 'AssemblyVersion', 'FileVersion')) {
              $expected = if ($propertyName -eq 'Version') { $packageVersion } else { ($packageVersion -split '[-+]')[0] }
              $node = $project.SelectSingleNode("/Project/PropertyGroup/$propertyName")
              if ($null -eq $node -or $node.InnerText -ne $expected) {
                  throw "Update project $propertyName to '$expected' before publishing."
              }
          }
          $notesPath = "release-notes/v$packageVersion.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
              throw "Missing release notes: $notesPath"
          }

          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT
          "raw_version=$rawVersion" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Run NUnit tests on both frameworks
        shell: pwsh
        run: |
          foreach ($framework in @('net472', 'net10.0')) {
              dotnet test OverKizApi.Tests/OverKizApi.Tests.csproj --configuration Release --framework $framework -p:ContinuousIntegrationBuild=true --filter "TestCategory!=Live" --logger "trx;LogFileName=tests.trx" --results-directory "artifacts/test-results/$framework"
              if ($LASTEXITCODE -ne 0) { throw "NUnit tests failed for $framework." }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ env.ARTIFACT_DIR }}" -Force | Out-Null
          dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.package_version }} -p:PackageVersion=${{ steps.version.outputs.package_version }} -o "${{ env.ARTIFACT_DIR }}"

      - name: Publish to NuGet
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "${{ env.ARTIFACT_DIR }}" -Filter '*.nupkg' | Where-Object { $_.Name -notlike '*.symbols.nupkg' }
          if (-not $packages) {
              throw 'No NuGet package was produced.'
          }

          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed for $($package.Name)." }
          }

      - name: Create GitHub release from tag
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.raw_version }}
          name: ${{ steps.version.outputs.raw_version }}
          body_path: ${{ steps.version.outputs.notes_path }}
          generate_release_notes: false
          prerelease: ${{ contains(steps.version.outputs.package_version, '-') }}
          files: ${{ env.ARTIFACT_DIR }}/*.nupkg
