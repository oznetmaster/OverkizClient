name: NUnit tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        framework: [net472, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run isolated API tests
        uses: oznetmaster/BuildAutomation@c0a215e202dc1e05a37707720ab12032be610518
        with:
          task: test-test-run-isolated-api-tests
        env:
          BUILD_INPUT_0: ${{ matrix.framework }}
          BUILD_INPUT_1: ${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.framework }}
          path: artifacts/test-results/${{ matrix.framework }}
          if-no-files-found: warn
