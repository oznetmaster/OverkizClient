  assemblies:
  - OverKizApi
  namespace: OverKizApi
  summary: >-
    Creates an <xref href="System.Net.Http.HttpClientHandler" data-throw-if-not-resolved="false"></xref> suitable for connecting to a local Overkiz gateway.

    The handler bypasses TLS certificate validation because local gateways use a self-signed certificate.

    The caller is responsible for disposing both the handler and the <xref href="System.Net.Http.HttpClient" data-throw-if-not-resolved="false"></xref> built from it.
