  summary: >-
    Deconstructs a <xref href="System.Collections.Generic.KeyValuePair%602" data-throw-if-not-resolved="false"></xref> into its key and value components,

    enabling <code>foreach (var (key, value) in dictionary)</code> syntax on targets below .NET 5

    where the BCL does not provide this method natively.
  example: []
  syntax:
