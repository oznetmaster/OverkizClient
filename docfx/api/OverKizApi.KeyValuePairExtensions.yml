      type: System.Collections.Generic.KeyValuePair{{TKey},{TValue}}
      description: The key/value pair to deconstruct.
    - id: key
      type: '{TKey}'
      description: Receives the <xref href="System.Collections.Generic.KeyValuePair%602.Key" data-throw-if-not-resolved="false"></xref>.
    - id: value
      type: '{TValue}'
      description: Receives the <xref href="System.Collections.Generic.KeyValuePair%602.Value" data-throw-if-not-resolved="false"></xref>.
    typeParameters:
    - id: TKey
      description: The type of the key.
    - id: TValue
      description: The type of the value.
