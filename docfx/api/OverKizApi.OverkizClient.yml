    id: RefreshToken
    path: ../OverKizApi/OverkizClient.cs
    startLine: 318
  assemblies:
  - OverKizApi
  namespace: OverKizApi
  summary: >-
    Refreshes the Somfy access token using the stored refresh token.

    This is called automatically by <xref href="OverKizApi.OverkizClient.RefreshTokenIfExpired" data-throw-if-not-resolved="false"></xref> when the token is near expiry;

    you do not normally need to call it manually.
  remarks: No-op if the current server is not <xref href="OverKizApi.OverkizConst.SupportedServers" data-throw-if-not-resolved="false"></xref>[<xref href="OverKizApi.Enums.Server.SomfyEurope" data-throw-if-not-resolved="false"></xref>].
  example: []
  syntax:
    content: public Task RefreshToken()
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Function RefreshToken() As Task
  overload: OverKizApi.OverkizClient.RefreshToken*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Thrown when no refresh token is available (i.e. <xref href="OverKizApi.OverkizClient.Login(System.Boolean)" data-throw-if-not-resolved="false"></xref> was not called first).
  - type: OverKizApi.Exceptions.SomfyBadCredentialsException
    commentId: T:OverKizApi.Exceptions.SomfyBadCredentialsException
    description: Thrown when the refresh token has been revoked.
  - type: OverKizApi.Exceptions.SomfyServiceException
    commentId: T:OverKizApi.Exceptions.SomfyServiceException
    description: Thrown when the Somfy token endpoint returns an unexpected response.
