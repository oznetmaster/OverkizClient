    path: ../OverKizApi/Enums/UI.cs
    startLine: 251
  assemblies:
  - OverKizApi
  namespace: OverKizApi.Enums
  summary: >-
    Maps to the <code>widgetName</code> field returned in a device definition.

    The widget name selects the specific UI control rendered by the Overkiz app for a device.

    Where a widget name matches a <xref href="OverKizApi.Enums.UIClass" data-throw-if-not-resolved="false"></xref> name the semantics are identical;

    not every <xref href="OverKizApi.Enums.UIClass" data-throw-if-not-resolved="false"></xref> value has a corresponding widget.
  example: []
  syntax:
    content: public enum UIWidget
    content.vb: Public Enum UIWidget
