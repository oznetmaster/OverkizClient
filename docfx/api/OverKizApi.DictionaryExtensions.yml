  namespace: OverKizApi
  summary: >-
    Gets a string value for a key or a fallback when not present.

    Assumes JSON deserialization never stores null values in the dictionary.
  example: []
  syntax:
    content: public static string GetStringOr(this IDictionary<string, object> dict, string key, string fallback = "Unknown")
    parameters:
    - id: dict
      type: System.Collections.Generic.IDictionary{System.String,System.Object}
      description: Source dictionary.
    - id: key
      type: System.String
      description: Key to look up.
    - id: fallback
      type: System.String
      description: Fallback string when key is missing.
    return:
      type: System.String
      description: String value or fallback.
    content.vb: Public Shared Function GetStringOr(dict As IDictionary(Of String, Object), key As String, fallback As String = "Unknown") As String
